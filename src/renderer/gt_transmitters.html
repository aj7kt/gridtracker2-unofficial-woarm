<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <title>Transmitters</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link rel="stylesheet" href="./lib/css/style.css" />
    <style type="text/css">
      body {
        -webkit-appearance: none;
        -webkit-user-select: none;
        height: 98%;
        overflow: auto;
      }
      table,
      th,
      td,
      body {
        color: #fff;
        white-space: nowrap;
        font-family: Sans-Serif;
        font-size: 12px;
      }
    </style>
    <script src="./lib/first.js"></script>
    <script>
      // The selected satellite's transmitters, with the frequencies to tune to and to transmit on now. The table is drawn by BirdWatch in the
      // main window (birdWatchDoppler.js) and put here again with each tracker tick, so it follows the satellite as it moves and as another is
      // selected
      function init()
      {
        // A click on a transmitter's name, downlink or uplink tunes the rig to it (birdWatchDopplerClick), while Rig Control is connected.
        // Taken as the button goes down: the table is drawn again with each tracker tick (its frequencies move), and a click whose press
        // was on a cell drawn over since is never sent
        document.getElementById("birdTx").addEventListener("mousedown", (event) =>
        {
          if (event.button != 0) return;
          const cell = event.target.closest("[data-part]");
          const row = cell && cell.closest("tr[data-uuid]");
          if (row) window.opener.birdWatchDopplerClick(row.dataset.uuid, cell.dataset.part);
        });
        // A right-click on a downlink or an uplink: the VFO it goes to picked for this transmitter (birdWatchPinChoices), or Automatic
        document.getElementById("birdTx").addEventListener("contextmenu", (event) =>
        {
          const cell = event.target.closest("[data-part='rx'], [data-part='tx']");
          const row = cell && cell.closest("tr[data-uuid]");
          if (!row) return;
          const uuid = row.dataset.uuid;
          const side = cell.dataset.part;
          const pick = window.opener.birdWatchPinChoices(uuid, side);
          if (!pick) return;
          const remote = window.require("@electron/remote");
          const items = pick.items.map((item) => ({ label: item.label, type: "radio", checked: item.checked, enabled: item.enabled !== false, click: () => window.opener.birdWatchPinSet(uuid, side, item.id) }));
          const menu = remote.Menu.buildFromTemplate([{ label: pick.title, enabled: false }, { type: "separator" }].concat(items));
          menu.popup({ window: remote.getCurrentWindow() });
        });
        window.opener.birdWatchTransmitterWindowReady();
      }

      // The main process has placed the window (and shown it, when it was open at exit): told so the table is filled in
      electron.ipcRenderer.on("windowPlaced", (event, visible) => window.opener.birdWatchTransmitterWindowPlaced(visible));

      document.oncontextmenu = function (event)
      {
        event.preventDefault();
      };
    </script>
  </head>
  <body id="mainBody" onload="init();" style="background-color: black">
    <div id="main" style="margin: 0; min-height: 40px; background-color: black; padding: 2px; text-align: center; position: relative; white-space: nowrap;">
      <div id="birdTxWrap" style="display: inline-block;">
        <!-- The satellite's name -->
        <div id="birdTxHead" style="display: flex; align-items: center; justify-content: center; gap: 14px; padding: 2px 0;">
          <span id="birdTxName" style="color: cyan; font-weight: bold;"></span>
          <!-- Said while the rig follows a transmitter of the table -->
          <span id="birdTxFollowing" style="color: lightgreen; font-weight: bold;"></span>
        </div>
        <div id="birdTx"></div>
      </div>
    </div>
  </body>
</html>
