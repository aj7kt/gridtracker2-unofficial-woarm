<html lang="en" xml:lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <!-- Not "GridTracker2 ...": first.js takes a title starting with that for the main window -->
    <title>User Guide</title>
    <link rel="stylesheet" href="./lib/css/style.css" />
    <style type="text/css">
      body,
      html {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background-color: black;
      }

      #guideMain {
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
        padding: 4px;
      }

      #guideBar {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        padding-bottom: 4px;
        color: white;
      }

      #userGuideFrame {
        flex: 1;
        width: 100%;
        background-color: #2a2a2e;
      }
    </style>
    <script src="./lib/first.js"></script>
    <script src="./lib/ui/i18n.js" type="text/javascript"></script>
    <script>
      // Searches the guide as you type (newSearch), or moves to the next / previous match
      function findInUserGuide(newSearch, forward = true)
      {
        let text = userGuideFind.value;
        try
        {
          if (text.length == 0)
          {
            userGuideFrame.stopFindInPage("clearSelection");
            userGuideFindCount.textContent = "";
            return;
          }
          // findNext: true starts a new search, false moves through the current one's matches
          userGuideFrame.findInPage(text, { forward: forward, findNext: newSearch });
        }
        catch (e)
        {
          // The guide isn't loaded yet
        }
      }

      function userGuideFindKey(event)
      {
        if (event.key == "Enter")
        {
          findInUserGuide(false, !event.shiftKey);
          event.preventDefault();
        }
      }

      // The PDF shown: the User Guide, or the one the main window was asked for (GT.userGuideFile: a Multi-Mode Decoder plugin's own
      // guide, openUserGuideWindow). Chromium's PDF viewer: sidebar closed, 73% zoom
      function userGuideLoad()
      {
        const file = GT.userGuideFile || path.resolve(resourcesPath, "data/help-en.pdf");
        const src = NodeURL.pathToFileURL(file).href + "#navpanes=0&zoom=73";
        if (userGuideFrame.getAttribute("src") == src) return;
        userGuideFind.value = "";
        userGuideFindCount.textContent = "";
        userGuideFrame.src = src;
      }

      function init()
      {
        loadChildWindowI18n();
        registerCutAndPasteContextMenu();
        userGuideFind.placeholder = userGuideFind.title;
        userGuideFrame.addEventListener("found-in-page", (event) =>
        {
          userGuideFindCount.textContent = event.result.matches ? event.result.activeMatchOrdinal + " / " + event.result.matches : "0 / 0";
        });
        userGuideLoad();
        GT.userGuideWindowInitialized = true;
        if (GT.userGuideShowOnLoad)
        {
          GT.userGuideShowOnLoad = false;
          electron.ipcRenderer.send("showWin", "gt_guide");
        }
      }
    </script>
  </head>
  <body onload="init();">
    <div id="guideMain">
      <div id="guideBar">
        <input id="userGuideFind" type="search" size="28" data-i18n="gt.userGuide.search.hover" title="Search the User Guide"
          oninput="findInUserGuide(true)" onkeydown="userGuideFindKey(event)" />
        <span id="userGuideFindCount" style="min-width: 60px"></span>
      </div>
      <webview id="userGuideFrame" plugins></webview>
    </div>
  </body>
</html>
