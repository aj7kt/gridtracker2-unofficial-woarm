<!DOCTYPE html>

<!-- The Log QSO window (lib/qso/logQsoWindow.js; the main window's lib/qso/logQso.js opens it): one QSO on a card, typed in or filled in
     from the rig, a Feed Roster spot or the Multi-Mode Decoder, handed to GridTracker's logging. Its tiles are built by logQsoWindow.js
     (lqBuild) from the layout kept. Enter logs; Escape only locks an unlocked card. Its title must not start with "GridTracker2" (first.js takes such a window
     for the main one) -->
<html lang="en" xml:lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Log QSO</title>
    <link rel="stylesheet" href="./lib/css/style.css" />
    <script src="./lib/first.js"></script>
    <script src="./lib/ui/formatters.js" type="text/javascript"></script>
    <script src="./lib/ui/i18n.js" type="text/javascript"></script>
    <script src="./lib/third-party/third-party.js" type="text/javascript"></script>
    <script src="./lib/qso/logQsoCore.js" type="text/javascript"></script>
    <script src="./lib/qso/logQsoWindow.js" type="text/javascript"></script>
    <script>
      document.addEventListener("dragover", function (event) { event.preventDefault(); });
      document.addEventListener("drop", function (event) { event.preventDefault(); });
    </script>
    <style>
      /* Every color from the App Theme, as the Lookup window's card: its hover accent for the call, the frames and (mixed with black) the
         panels; its value and label colors for the text */
      :root {
        --lq-accent: var(--gt-hover-accent);
        --lq-text: var(--gt-lookup-text);
        --lq-muted: var(--gt-lookup-muted);
        --lq-bg: #000;
        --lq-panel: color-mix(in srgb, var(--lq-accent) 5%, black);
        --lq-edge: color-mix(in srgb, var(--lq-accent) 22%, black);
        /* The views' sheet the tiles sit on, and its edge (the tab showing's too) */
        --lq-sheet: color-mix(in srgb, var(--lq-accent) 11%, black);
        --lq-sheet-edge: color-mix(in srgb, var(--lq-accent) 38%, black);
      }
      body {
        overflow: hidden;
        white-space: normal;
        background: var(--lq-bg);
        color: var(--lq-text);
      }
      #lqBox {
        position: absolute;
        inset: 0;
        overflow-x: hidden;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 10px 12px 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        text-align: left;
      }

      /* The hero: the call large, its underline the hero's full width; the VFO menu and the lock in its top right corner; along its foot
         the views' tabs, the one showing open into the sheet of tiles joined under it, and the chips beside them */
      .lqHero {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 10px 14px 0;
        border: 1px solid var(--lq-sheet-edge);
        border-radius: 12px 12px 0 0;
        background: linear-gradient(180deg, color-mix(in srgb, var(--lq-accent) 19%, black) 0%, color-mix(in srgb, var(--lq-accent) 8%, black) 65%, color-mix(in srgb, var(--lq-accent) 4%, black) 100%);
        box-shadow: inset 0 1px 0 #ffffff14;
      }
      .lqHeroMain {
        min-width: 0;
      }
      .lqHeroSide {
        position: absolute;
        z-index: 2;
        top: 10px;
        right: 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: 45%;
      }
      .lqSideTop {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
      }
      /* The UTC clock under the VFO menu, its left edge at the menu's */
      .lqHeroSide .lqClock {
        align-self: flex-start;
      }
      .lqSideTop .lqPill {
        flex: 1 1 auto;
        min-width: 0;
        max-width: none;
      }
      /* The views as folder tabs on the hero's foot: the one showing joined to the sheet of tiles under it (over the hero's edge), the
         other lower, behind it */
      .lqDeck {
        display: flex;
        flex-direction: column;
      }
      .lqTabs {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: flex-end;
        gap: 3px;
        margin: -4px 0 -1px;
      }
      .lqTab {
        cursor: pointer;
        padding: 4px 18px 4px;
        border: 1px solid var(--lq-edge);
        border-bottom: 1px solid var(--lq-sheet-edge);
        border-radius: 9px 9px 0 0;
        background: color-mix(in srgb, var(--lq-accent) 4%, black);
        color: var(--lq-muted);
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .lqTab:hover {
        color: var(--gt-count);
      }
      .lqTab.lqOn {
        padding: 6px 20px 7px;
        border-color: var(--lq-sheet-edge);
        border-bottom-color: var(--lq-sheet);
        background: var(--lq-sheet);
        color: var(--lq-accent);
        box-shadow: inset 0 2px 0 var(--lq-accent);
      }
      #lqTiles {
        padding: 10px;
        border: 1px solid var(--lq-sheet-edge);
        border-top: none;
        border-radius: 0 0 10px 10px;
        background: var(--lq-sheet);
      }
      /* The bearing and distance chips in their own colors (the map's and the rosters') */
      .lqChip.lqFreq {
        color: var(--gt-frequency);
        font-variant-numeric: tabular-nums;
      }
      .lqChip.lqBearing {
        color: var(--gt-azimuth);
      }
      .lqChip.lqDistance {
        color: var(--gt-distance);
      }
      .lqHeroLabel {
        display: block;
        color: var(--gt-title);
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .lqCall {
        width: 100%;
        box-sizing: border-box;
        margin: 2px 0 0;
        padding: 0 2px 2px;
        border: none;
        border-bottom: 2px solid color-mix(in srgb, var(--lq-accent) 45%, black);
        background: transparent;
        color: var(--lq-accent);
        font-size: 34px;
        font-weight: bold;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 0 0 16px color-mix(in srgb, var(--lq-accent) 35%, transparent);
        outline: none;
      }
      .lqCall:focus {
        border-bottom-color: var(--lq-accent);
      }
      /* An empty call box with the keys: a tall pipe in the accent strobing slowly where the call starts (the box's own caret hidden till
         a key is typed) */
      .lqCallWrap {
        position: relative;
      }
      .lqCaret {
        display: none;
        position: absolute;
        left: 3px;
        top: 7px;
        bottom: 9px;
        width: 3px;
        border-radius: 2px;
        background: var(--lq-accent);
        box-shadow: 0 0 10px var(--lq-accent);
        pointer-events: none;
        animation: lqStrobe 1.8s ease-in-out infinite;
      }
      .lqCall:placeholder-shown:focus {
        caret-color: transparent;
      }
      .lqCall:placeholder-shown:focus + .lqCaret {
        display: block;
      }
      @keyframes lqStrobe {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.08;
        }
      }
      .lqCall.logQsoBad {
        border-bottom-color: var(--gt-error);
        color: var(--gt-error);
      }
      /* The chips in the tabs' row, right of the tabs (above the hero's foot, wrapping when there are many) */
      .lqChips {
        flex: 1 1 auto;
        align-self: center;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        min-width: 0;
        min-height: 20px;
        margin: 0 0 3px 10px;
      }
      .lqChip {
        display: inline-flex;
        align-items: center;
        padding: 1px 9px;
        border: 1px solid color-mix(in srgb, var(--lq-accent) 32%, black);
        border-radius: 10px;
        background: color-mix(in srgb, var(--lq-accent) 10%, black);
        color: var(--gt-count);
        font-size: 12px;
        font-weight: bold;
        white-space: nowrap;
      }
      .lqChip:empty {
        display: none;
      }
      /* The band and mode chips in their own colors (Settings -> Colors) */
      .lqOwn {
        border-color: color-mix(in srgb, var(--own-color, var(--lq-accent)) 70%, black);
        background: color-mix(in srgb, var(--own-color, var(--lq-accent)) 22%, black);
        color: var(--own-color, var(--gt-count));
      }
      .lqClock {
        color: var(--lq-muted);
        font-weight: normal;
        font-variant-numeric: tabular-nums;
      }
      .lqWarn {
        border-color: color-mix(in srgb, var(--gt-warning) 55%, black);
        background: color-mix(in srgb, var(--gt-warning) 14%, black);
        color: var(--gt-warning);
      }
      .lqBusy {
        border-color: color-mix(in srgb, var(--gt-status-busy) 55%, black);
        background: color-mix(in srgb, var(--gt-status-busy) 14%, black);
        color: var(--gt-status-busy);
      }
      .lqPill {
        max-width: 190px;
        padding: 2px 8px;
        border: 1px solid color-mix(in srgb, var(--lq-accent) 40%, black);
        border-radius: 12px;
        font-size: 12px;
      }
      .lqLock {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 26px;
        border: 1px solid color-mix(in srgb, var(--lq-accent) 40%, black);
        border-radius: 13px;
        background: color-mix(in srgb, var(--lq-accent) 10%, black);
        color: var(--lq-muted);
        cursor: pointer;
      }
      .lqLock:hover {
        border-color: var(--gt-hover-border);
        color: var(--gt-count);
      }
      .lqLock.lqOpen {
        border-color: var(--gt-warning);
        background: color-mix(in srgb, var(--gt-warning) 18%, black);
        color: var(--gt-warning);
        box-shadow: 0 0 10px color-mix(in srgb, var(--gt-warning) 35%, transparent);
      }

      /* Unlocked: a bar says how, the tiles are dashed and can be dragged, their boxes can't be typed in meanwhile */
      .lqUnlockBar {
        display: none;
        padding: 5px 10px;
        border: 1px dashed color-mix(in srgb, var(--gt-warning) 60%, black);
        border-radius: 8px;
        background: color-mix(in srgb, var(--gt-warning) 9%, black);
        color: var(--gt-warning);
        font-size: 12px;
        text-align: center;
      }
      .lqUnlocked .lqUnlockBar {
        display: block;
      }
      /* Unlock Widths: the 1x column's width (a 2x tile is two of them and the gap) */
      .lqWidthBar {
        display: none;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 4px 10px;
        border: 1px dashed color-mix(in srgb, var(--gt-warning) 60%, black);
        border-radius: 8px;
        background: color-mix(in srgb, var(--gt-warning) 9%, black);
        color: var(--gt-warning);
        font-size: 12px;
      }
      .lqWidthsOn .lqWidthBar {
        display: flex;
      }
      .lqWidthBar input {
        width: 220px;
        accent-color: var(--gt-warning);
      }
      #logQsoColWidthValue {
        min-width: 44px;
        font-variant-numeric: tabular-nums;
      }

      /* The tiles: a label over its box, as many to a row as fit; one grid to a view, the view shown's alone showing */
      .lqViewGrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(var(--lq-col, 115px), 1fr));
        gap: 8px;
      }
      .lqTile {
        min-width: 0;
        padding: 6px 9px 8px;
        border: 1px solid var(--lq-edge);
        border-radius: 9px;
        background: var(--lq-panel);
        transition: border-color 0.15s, background-color 0.15s, box-shadow 0.15s, transform 0.15s;
      }
      .lqTile:focus-within {
        border-color: color-mix(in srgb, var(--lq-accent) 60%, black);
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--lq-accent) 30%, transparent), 0 0 14px color-mix(in srgb, var(--lq-accent) 18%, transparent);
      }
      /* A tile under the mouse shaded as the tab showing is: a lighter panel, the accent along its top, its label in the accent */
      .lqTile:hover {
        border-color: var(--lq-sheet-edge);
        background: color-mix(in srgb, var(--lq-accent) 15%, black);
        box-shadow: inset 0 2px 0 var(--lq-accent);
      }
      .lqTile:hover .lqLabel {
        color: var(--lq-accent);
      }
      /* A field this QSO's data brought (a spot's park or summit) that the layout doesn't have */
      .lqTile.lqFromData {
        border-color: color-mix(in srgb, var(--gt-status-ok) 50%, black);
      }
      /* One height whatever shows in it (the grip, an added field's x), so a tile never grows when they appear */
      .lqLabel {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 13px;
        line-height: 13px;
        margin-bottom: 3px;
        color: var(--lq-muted);
        font-size: 10px;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }
      .lqLabelText {
        flex: 1 1 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lqGrip {
        display: none;
        line-height: 13px;
      }
      /* An added field's x: always there (its room kept), seen on hover or unlocked */
      .lqRemove {
        flex: 0 0 auto;
        visibility: hidden;
        cursor: pointer;
        padding: 0 2px;
        color: var(--lq-muted);
        font-size: 11px;
        line-height: 13px;
      }
      .lqRemove:hover {
        color: var(--gt-error);
      }
      /* A Retain switch beside a label (Power, Comment, Propagation Mode, the satellite's, Rx Freq): a small track with a knob, off at the
         left in the label's gray, on at the right in the accent, glowing; the label's height kept */
      .lqRetain {
        flex: 0 0 auto;
        position: relative;
        width: 20px;
        height: 10px;
        box-sizing: border-box;
        border: 1px solid color-mix(in srgb, var(--lq-muted) 60%, black);
        border-radius: 6px;
        background: color-mix(in srgb, var(--lq-muted) 12%, black);
        cursor: pointer;
        transition: background-color 0.15s, border-color 0.15s, box-shadow 0.15s;
      }
      .lqRetain::after {
        content: "";
        position: absolute;
        top: 1px;
        left: 1px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--lq-muted);
        transition: left 0.15s, background-color 0.15s;
      }
      .lqRetain:hover {
        border-color: var(--gt-hover-border);
      }
      .lqRetain.lqOn {
        border-color: var(--lq-accent);
        background: color-mix(in srgb, var(--lq-accent) 35%, black);
        box-shadow: 0 0 6px color-mix(in srgb, var(--lq-accent) 45%, transparent);
      }
      .lqRetain.lqOn::after {
        left: 11px;
        background: var(--gt-count);
      }
      /* Unlock Widths: a tile's 1x and 2x buttons in its label (the label's height kept), the width it is lit */
      .lqWidths {
        flex: 0 0 auto;
        display: inline-flex;
        gap: 2px;
      }
      .lqWidthBtn {
        cursor: pointer;
        padding: 0 4px;
        border: 1px solid color-mix(in srgb, var(--gt-warning) 45%, black);
        border-radius: 5px;
        color: var(--lq-muted);
        font-size: 9px;
        line-height: 11px;
        letter-spacing: 0;
        text-transform: none;
      }
      .lqWidthBtn:hover {
        color: var(--gt-count);
      }
      .lqWidthBtn.lqOn {
        border-color: var(--gt-warning);
        background: color-mix(in srgb, var(--gt-warning) 25%, black);
        color: var(--gt-warning);
      }
      .lqWidthsOn .lqTile {
        border-color: color-mix(in srgb, var(--gt-warning) 45%, black);
      }
      .lqExtra:hover .lqRemove,
      .lqUnlocked .lqRemove {
        visibility: visible;
      }
      .lqUnlocked .lqTile {
        border-style: dashed;
        border-color: color-mix(in srgb, var(--gt-warning) 45%, black);
        cursor: grab;
      }
      .lqUnlocked .lqTile:hover {
        transform: translateY(-1px);
        border-color: var(--gt-warning);
      }
      .lqUnlocked .lqGrip {
        display: inline;
        color: var(--gt-warning);
      }
      .lqUnlocked .lqTile input,
      .lqUnlocked .lqTile select,
      .lqUnlocked .lqNow {
        pointer-events: none;
        opacity: 0.55;
      }
      .lqTile.lqDragging {
        opacity: 0.35;
      }
      .lqInput {
        width: 100%;
        min-width: 0;
        box-sizing: border-box;
        padding: 3px 6px;
        border-radius: 6px;
        font-size: 14px;
      }
      .lqUpper {
        text-transform: uppercase;
      }
      .lqPair {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .lqPair .lqInput {
        flex: 1 1 0;
      }
      .lqPair .lqDate {
        flex: 1.35 1 0;
      }
      .lqSlash {
        color: var(--lq-muted);
      }
      .lqBandText {
        flex: 0 0 auto;
        min-width: 34px;
        color: var(--gt-band);
        font-weight: bold;
      }
      .lqNow {
        flex: 0 0 auto;
        cursor: pointer;
        padding: 2px 8px;
        border: 1px solid color-mix(in srgb, var(--lq-accent) 45%, black);
        border-radius: 10px;
        background: color-mix(in srgb, var(--lq-accent) 12%, black);
        color: var(--lq-accent);
        font-size: 11px;
        font-weight: bold;
      }
      .lqNow:hover {
        border-color: var(--gt-hover-border);
        color: var(--gt-count);
      }
      /* A box with something wrong in it */
      .lqTile .logQsoBad {
        background-color: var(--gt-input-invalid-bg);
        color: var(--gt-input-invalid-text);
      }

      /* A box's suggestion list, drawn in the card: fixed under (or over) its box, as tall as the window leaves room for, scrolling */
      .lqDrop {
        position: fixed;
        z-index: 50;
        box-sizing: border-box;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 3px 0;
        border: 1px solid color-mix(in srgb, var(--lq-accent) 50%, black);
        border-radius: 8px;
        background: color-mix(in srgb, var(--lq-accent) 7%, black);
        box-shadow: 0 8px 22px #000000d0, 0 0 12px color-mix(in srgb, var(--lq-accent) 18%, transparent);
        font-size: 13px;
        text-align: left;
      }
      .lqDropItem {
        display: flex;
        gap: 10px;
        padding: 3px 10px;
        cursor: pointer;
        color: var(--lq-text);
        white-space: nowrap;
      }
      .lqDropValue {
        flex: 0 0 auto;
        font-weight: bold;
      }
      .lqDropLabel {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        color: var(--lq-muted);
        text-overflow: ellipsis;
      }
      .lqDropItem:hover,
      .lqDropItem.lqHot {
        background: color-mix(in srgb, var(--lq-accent) 30%, black);
        color: var(--gt-count);
      }

      /* The foot: what's wrong, Cancel and Log QSO */
      .lqFoot {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: auto;
        padding-top: 2px;
      }
      .lqError {
        flex: 1 1 auto;
        color: var(--gt-error);
        font-size: 12px;
        font-weight: bold;
      }
      .lqBtn {
        cursor: pointer;
        padding: 5px 16px;
        border: 1px solid color-mix(in srgb, var(--gt-label) 35%, black);
        border-radius: 14px;
        background: color-mix(in srgb, var(--lq-accent) 7%, black);
        color: var(--lq-text);
        font-weight: bold;
        white-space: nowrap;
      }
      .lqBtn:hover {
        border-color: var(--gt-hover-border);
        color: var(--gt-count);
      }
      .lqBtn:active {
        transform: translateY(1px);
      }
      .lqPrimary {
        border-color: color-mix(in srgb, var(--lq-accent) 80%, black);
        background: linear-gradient(color-mix(in srgb, var(--lq-accent) 55%, black), color-mix(in srgb, var(--lq-accent) 36%, black));
        color: var(--gt-count);
        box-shadow: 0 0 12px color-mix(in srgb, var(--lq-accent) 25%, transparent);
      }
      .lqPrimary:hover {
        background: linear-gradient(color-mix(in srgb, var(--lq-accent) 72%, black), color-mix(in srgb, var(--lq-accent) 47%, black));
      }
    </style>
  </head>

  <body id="mainBody" onload="logQsoWinInit();">
    <div id="lqBox">
      <div class="lqUnlockBar" data-i18n="logQso.unlocked.label">Drag the fields to move them; right-click to add a field, or take one off with its x</div>
      <div class="lqWidthBar">
        <span data-i18n="logQso.width.column.label">1× Width</span>
        <input type="range" id="logQsoColWidth" min="115" max="320" step="5" oninput="lqSetColWidth(this.value);" onchange="lqSetColWidth(this.value, true);" />
        <span id="logQsoColWidthValue"></span>
      </div>
      <div class="lqDeck">
      <div class="lqHero">
        <div class="lqHeroMain">
          <label for="logQsoCall" class="lqHeroLabel" data-i18n="gt.newCallList.Call">Call</label>
          <div class="lqCallWrap">
            <input type="text" id="logQsoCall" class="lqCall" maxlength="20" spellcheck="false" placeholder=" " oninput="logQsoWinCallInput();" onchange="logQsoWinLookup(); logQsoWinHint();" />
            <span class="lqCaret"></span>
          </div>
        </div>
        <div class="lqHeroSide">
          <div class="lqSideTop">
            <select id="logQsoVfo" class="inputTextValue lqPill" style="display: none" data-i18n="logQso.vfo.hover" title="The Rig Control VFO the frequency and mode are taken from" onchange="logQsoWinVfoChanged();"></select>
            <span id="logQsoLock" class="lqLock" onclick="logQsoWinLockToggle();"></span>
          </div>
          <span id="logQsoUtcChip" class="lqChip lqClock"></span>
        </div>
        <div class="lqTabs">
          <span id="logQsoViewQso" class="lqTab" onclick="logQsoWinView('qso');" data-i18n="logQso.view.qso.label">QSO</span>
          <span id="logQsoViewStation" class="lqTab" onclick="logQsoWinView('station');" data-i18n="logQso.view.station.label">My Station</span>
