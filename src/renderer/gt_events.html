<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <title>Events</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link rel="stylesheet" href="./lib/css/style.css" />
    <style type="text/css">
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background-color: black;
      }
      body {
        -webkit-appearance: none;
        -webkit-user-select: none;
        color: var(--gt-label);
        white-space: nowrap;
        font-family: Sans-Serif;
        font-size: 12px;
      }
      /* The list fills the window, its Event column wrapped to the window's width: it only scrolls up and down */
      #eventsList {
        height: 100%;
        max-width: none;
        width: auto;
        min-width: 100%;
        box-sizing: border-box;
        overflow-x: hidden;
      }
    </style>
    <script src="./lib/first.js"></script>
    <script>
      // The Event Viewer in a window of its own: the list is drawn by the main window (ui/events.js) into #eventsList, and again with each
      // event and scroll
      function init()
      {
        window.opener.eventsWindowReady();
      }

      // The main process has placed the window (and shown it, when it was open at exit): told so the list is filled in
      electron.ipcRenderer.on("windowPlaced", (event, visible) => window.opener.eventsWindowPlaced(visible));

      document.oncontextmenu = function (event)
      {
        event.preventDefault();
      };
    </script>
  </head>
  <body id="mainBody" onload="init();">
    <!-- The list's header has Clear and To Main (which moves the viewer back to the main window's panel) -->
    <div id="eventsList" class="eventsList"></div>
  </body>
</html>
