<html lang="en" xml:lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Callsign Lookup</title>
    <link rel="stylesheet" href="./lib/css/style.css" />
    <script src="./lib/first.js"></script>
    <script src="./lib/ui/formatters.js" type="text/javascript"></script>
    <script src="./lib/ui/i18n.js" type="text/javascript"></script>
    <script>
      document.oncontextmenu = function () {
        return false;
      };

      document.addEventListener("dragover", function (event) {
        event.preventDefault();
      });

      document.addEventListener("drop", function (event) {
        event.preventDefault();
      });

      function lookupCallsign(callsign, grid, cache) {
        window.opener.lookupCallsign(callsign, grid, cache);
      }

      function ValidateCallsign(inputText, validDiv) {
        if (inputText.value.length > 0) {
          let passed = false;
          inputText.value = inputText.value.toUpperCase();
          if (/\d/.test(inputText.value) || /[A-Z]/.test(inputText.value)) {
            passed = true;
          }
          if (passed) {
            inputText.style.color = "var(--gt-input-text)";
            inputText.style.backgroundColor = "var(--gt-input-bg)";
            if (validDiv) validDiv.innerHTML = "Valid!";
            return true;
          } else {
            inputText.style.color = "var(--gt-input-empty-text)";
            inputText.style.backgroundColor = "var(--gt-input-empty-bg)";
            if (validDiv) validDiv.innerHTML = "Invalid!";
            return false;
          }
        } else {
          inputText.style.color = "var(--gt-input-empty-text)";
          inputText.style.backgroundColor = "var(--gt-input-empty-bg)";
          if (validDiv) validDiv.innerHTML = "Invalid!";
          return false;
        }
      }

      function validateCallByElement(elementString) {
        ValidateCallsign(window[elementString], null);
      }

      function init() {
        ValidateCallsign(lookupCallsignInput, null);
        loadChildWindowI18n();
        registerCutAndPasteContextMenu();
        // What lookup.js writes here, and a photo or flag loaded (or not), changes the content's size: the window follows it
        new MutationObserver(lookupFit).observe(lookupWrap, { childList: true, subtree: true, characterData: true });
        lookupWrap.addEventListener("load", lookupFit, true);
        lookupWrap.addEventListener("error", lookupFit, true);
        GT.lookupWindowInitialized = true;
      }

      function addTextToClipboard(data) {
        navigator.clipboard.writeText(data);
      }

      function setClipboardFromLookup() {
        if (GT.lastLookupAddress) {
          addTextToClipboard(GT.lastLookupAddress);
        }
      }

      // The window fitted to what it shows, as the transmitters window is (birdWatchTransmitterWindowUpdate): the content's natural size,
      // with a vertical scroll bar's room (it shows when the screen is too small for it all); the main process sets the window's content to
      // that, no bigger than fits on the screen (fitWin). Each time the content changes, and the zoom. Not before the main process has
      // placed the window (it puts the saved size back then), nor while a lookup is on its way (its "please wait" in place of the card),
      // so the window doesn't shrink for that and grow again
      let lookupPlaced = false;
      let lookupFitRatio = 0;

      function lookupFit() {
        if (!lookupPlaced || lookupInfoDiv.querySelector(".lookupWait")) return;
        lookupFitRatio = window.devicePixelRatio;
        const box = lookupWrap.getBoundingClientRect();
        const width = Math.ceil(box.width) + 16;
        const height = Math.ceil(box.height);
        if (Math.abs(window.innerWidth - width) > 1 || Math.abs(window.innerHeight - height) > 1) electron.ipcRenderer.send("fitWin", "gt_lookup", width, height, false);
      }

      electron.ipcRenderer.on("windowPlaced", () => {
        lookupPlaced = true;
        lookupFit();
      });

      // Zoomed in or out (the content's size on the screen changes with it); not the user's own resizing, which is kept until the content
      // changes
      window.addEventListener("resize", () => {
        if (window.devicePixelRatio != lookupFitRatio) lookupFit();
      });
    </script>
  </head>

  <body id="mainBody" onload="init();">
    <!-- Fills the window, and scrolls what doesn't fit in it (a window made smaller than its content) -->
    <div id="lookupBoxDiv">
      <!-- The content at its natural size, which the window is fitted to (lookupFit) -->
      <div id="lookupWrap">
        <div class="lookupSearch">
          <label data-i18n="lookup.callsign.label" for="lookupCallsignInput">Callsign</label>
          <input
            id="lookupCallsignInput" type="text" class="inputTextValue" size="12" onkeyup="if (event.keyCode == 13) lookupButtonID.click();" oninput="ValidateCallsign(this,null);"/>
          <div
            data-i18n="lookup.callsign.button"
            id="lookupButtonID"
            title="Lookup Callsign"
            class="lookupGo"
            onclick="if ( ValidateCallsign(lookupCallsignInput,null) ) { lookupCallsign(lookupCallsignInput.value, null, false);}">
            Lookup
          </div>
        </div>
        <!-- Written by lookup.js: the acknowledgement, Clear and Generate Messages, the station's card (or a message in its place), your log
             for the call, and the Details -->
        <div id="lookupAckDiv"></div>
        <div id="lookupActionsDiv"></div>
        <div data-i18n="lookup.noinfo" id="lookupInfoDiv">No Callsign information to display, try a lookup!</div>
        <div id="lookupLocalDiv"></div>
        <div id="lookupDetailsDiv"></div>
      </div>
    </div>
  </body>
</html>
