<!-- The keyboard modes' plugin's parts of the decoder window (mmdPluginHost.js puts each template's contents in its slot) -->
<!-- subBar: the submode menu, in the row under the second line -->
<template data-slot="subBar">
  <!-- PSK, MFSK and DominoEX / THOR: the submode decoded (mmdKey.js); every signal of it in the passband is found -->
  <span id="cwKeyBox" class="cwPick" style="display: none;"><label for="cwKeySub" data-i18n="cwViewer.submode.label">Submode</label><select id="cwKeySub" data-i18n="cwViewer.key.hover" title="The submode decoded: every signal of it in the passband is found and decoded. An RSID heard and clicked sets it" onchange="mmdKeyPicked();"></select></span>
</template>
<!-- settings: its boxes on Settings, Decoders (the same rows as every mode's) -->
<template data-slot="settings">
  <div class="rigVfoBox">
    <div class="rigVfoTitle"><span data-i18n="settings.thorDecoder.label">DominoEX / THOR</span></div>
    <table>
      <tr class="mmdInputRow">
        <td class="mapRowLabel mapRowLabelLeft"><label data-i18n="settings.audio.row.inputDevice.label" for="thorInputSelect">Input Device</label></td>
        <td><select id="thorInputSelect" class="mmdInputSelect" data-i18n="cwViewer.input.hover" title="The rig's audio this mode listens to: each mode keeps its own" onchange="mmdSetInput('thor');"></select></td>
      </tr>
      <tr class="mmdRigRow mmdVfoRow">
        <td class="mapRowLabel mapRowLabelLeft"><label data-i18n="settings.mmDecoder.vfo.label" for="thorVfoSelect">VFO</label></td>
        <td><select id="thorVfoSelect" data-i18n="settings.mmDecoder.vfo.hover" title="The Rig Control VFO this mode reads and, with Rig Control, tunes" onchange="mmdSetVfo('thor');"></select></td>
      </tr>
      <tr class="mmdRigRow">
        <td colspan="2" class="mapRowLabel mapRowLabelLeft"><input data-i18n="settings.mmDecoder.setFreq.hover" title="Picking a frequency in the Frequency menu tunes the rig there" type="checkbox" id="thorSetFreqValue" onclick="mmdSetRigSend('thor');" /> <label data-i18n="settings.mmDecoder.setFreq.label" for="thorSetFreqValue">Set Frequency</label> <input data-i18n="settings.keyDecoder.setMode.hover" title="Picking a frequency in the Frequency menu sets the rig to USB" type="checkbox" id="thorSetModeValue" onclick="mmdSetRigSend('thor');" /> <label data-i18n="settings.ft8Decoder.setMode.label" for="thorSetModeValue">Set Mode</label></td>
      </tr>
    </table>
  </div>
